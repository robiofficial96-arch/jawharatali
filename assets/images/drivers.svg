<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" style="background: linear-gradient(135deg, #F8FAFC 0%, #FFFFFF 100%);">
  <defs>
    <linearGradient id="driverRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E83842" />
      <stop offset="100%" stop-color="#C7222A" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="500" cy="120" r="140" fill="#C7222A" opacity="0.06" />
  <circle cx="100" cy="280" r="150" fill="#3B82F6" opacity="0.05" />
  <!-- Transport Fleet Bus Silhouette in Light Slate -->
  <g transform="translate(60, 160)" opacity="0.8">
    <rect x="0" y="40" width="220" height="90" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" />
    <rect x="20" y="55" width="35" height="30" rx="3" fill="#0284C7" opacity="0.7" />
    <rect x="65" y="55" width="35" height="30" rx="3" fill="#0284C7" opacity="0.7" />
    <rect x="110" y="55" width="35" height="30" rx="3" fill="#0284C7" opacity="0.7" />
    <rect x="155" y="55" width="45" height="30" rx="3" fill="#0284C7" opacity="0.7" />
    <circle cx="50" cy="135" r="22" fill="#1E293B" stroke="#CBD5E1" stroke-width="4" />
    <circle cx="170" cy="135" r="22" fill="#1E293B" stroke="#CBD5E1" stroke-width="4" />
    <rect x="210" y="95" width="10" height="15" rx="3" fill="#F59E0B" />
  </g>
  <!-- Driver Character -->
  <g transform="translate(340, 95)">
    <rect x="55" y="180" width="22" height="90" fill="#334155" rx="4" />
    <rect x="85" y="180" width="22" height="90" fill="#334155" rx="4" />
    <rect x="50" y="260" width="28" height="15" fill="#0F172A" rx="3" />
    <rect x="85" y="260" width="28" height="15" fill="#0F172A" rx="3" />
    <path d="M35,65 L125,65 L135,185 L25,185 Z" fill="#334155" />
    <polygon points="65,65 95,65 80,95" fill="url(#driverRed)" />
    <!-- Brand Logo -->
    <rect x="90" y="95" width="26" height="20" rx="3" fill="#FFFFFF" stroke="#C7222A" stroke-width="1" />
    <text x="103" y="109" font-size="8" fill="#C7222A" font-weight="900" text-anchor="middle">JA</text>
    <circle cx="80" cy="35" r="26" fill="#D99B6A" />
    <path d="M54,26 Q80,5 106,26 L120,30 L54,30 Z" fill="#C7222A" />
    <!-- Steering Wheel -->
    <circle cx="50" cy="140" r="30" fill="none" stroke="#475569" stroke-width="6" />
    <circle cx="50" cy="140" r="10" fill="#E2E8F0" />
    <line x1="20" y1="140" x2="80" y2="140" stroke="#475569" stroke-width="4" />
    <line x1="50" y1="140" x2="50" y2="170" stroke="#475569" stroke-width="4" />
  </g>
  <!-- Category Badge -->
  <rect x="25" y="25" width="230" height="32" rx="16" fill="#FFFFFF" stroke="#C7222A" stroke-width="1.5" />
  <text x="140" y="46" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" fill="#C7222A" text-anchor="middle">DRIVERS &amp; HEAVY OPERATORS</text>
</svg>
