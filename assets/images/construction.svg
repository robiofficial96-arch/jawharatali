<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" style="background: linear-gradient(135deg, #F8FAFC 0%, #FFFFFF 100%);">
  <defs>
    <linearGradient id="safetyOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>
  <!-- Background Glow &amp; Construction Elements -->
  <circle cx="480" cy="120" r="150" fill="#EA580C" opacity="0.08" />
  <circle cx="120" cy="280" r="160" fill="#C7222A" opacity="0.05" />
  <!-- Construction Crane &amp; Framework -->
  <g stroke="#CBD5E1" stroke-width="2" opacity="0.8" fill="none">
    <line x1="480" y1="50" x2="480" y2="350" stroke-width="3" />
    <line x1="360" y1="100" x2="550" y2="100" stroke-width="3" />
    <line x1="480" y1="50" x2="400" y2="100" />
    <line x1="480" y1="50" x2="530" y2="100" />
    <line x1="390" y1="100" x2="390" y2="170" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4" />
    <rect x="375" y="170" width="30" height="20" fill="#EA580C" opacity="0.9" />
  </g>
  <!-- Beams -->
  <g stroke="#E2E8F0" stroke-width="3">
    <line x1="80" y1="180" x2="80" y2="360" />
    <line x1="160" y1="140" x2="160" y2="360" />
    <line x1="240" y1="200" x2="240" y2="360" />
    <line x1="50" y1="240" x2="260" y2="240" />
    <line x1="60" y1="300" x2="280" y2="300" />
  </g>
  <!-- Ground Line -->
  <rect x="0" y="350" width="600" height="50" fill="#F1F5F9" />
  <line x1="0" y1="350" x2="600" y2="350" stroke="#C7222A" stroke-width="3" />
  <!-- Worker Character -->
  <g transform="translate(250, 95)">
    <rect x="65" y="175" width="24" height="85" fill="#334155" rx="4" />
    <rect x="98" y="175" width="24" height="85" fill="#334155" rx="4" />
    <rect x="58" y="255" width="32" height="15" fill="#78350F" rx="3" />
    <rect x="98" y="255" width="32" height="15" fill="#78350F" rx="3" />
    <path d="M42,65 L144,65 L150,180 L36,180 Z" fill="url(#safetyOrange)" />
    <rect x="42" y="125" width="108" height="14" fill="#FFFFFF" />
    <line x1="68" y1="65" x2="68" y2="125" stroke="#FFFFFF" stroke-width="8" />
    <line x1="118" y1="65" x2="118" y2="125" stroke="#FFFFFF" stroke-width="8" />
    <!-- Brand Logo -->
    <rect x="55" y="85" width="26" height="20" rx="3" fill="#FFFFFF" stroke="#C7222A" stroke-width="1" />
    <text x="68" y="99" font-size="8" fill="#C7222A" font-weight="900" text-anchor="middle">JA</text>
    <circle cx="93" cy="35" r="26" fill="#D99B6A" />
    <path d="M60,35 C60,5 126,5 126,35 C132,37 132,44 126,46 L60,46 C54,44 54,37 60,35 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <circle cx="93" cy="22" r="8" fill="#C7222A" />
    <text x="93" y="25" font-size="7" fill="#FFF" font-weight="900" text-anchor="middle">JA</text>
    <rect x="135" y="130" width="36" height="48" rx="3" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5" transform="rotate(15 135 130)" />
    <line x1="140" y1="145" x2="160" y2="145" stroke="#FFF" stroke-width="2" transform="rotate(15 135 130)" />
    <line x1="140" y1="155" x2="155" y2="155" stroke="#FFF" stroke-width="2" transform="rotate(15 135 130)" />
  </g>
  <!-- Category Badge -->
  <rect x="25" y="25" width="210" height="32" rx="16" fill="#FFFFFF" stroke="#C7222A" stroke-width="1.5" />
  <text x="130" y="46" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" fill="#C7222A" text-anchor="middle">CONSTRUCTION &amp; CIVIL</text>
</svg>
