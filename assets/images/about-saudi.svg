<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" style="background: linear-gradient(135deg, #F8FAFC 0%, #FFFFFF 100%);">
  <defs>
    <linearGradient id="aboutRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E83842" />
      <stop offset="100%" stop-color="#C7222A" />
    </linearGradient>
    <filter id="softShadowLight2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>
  <!-- Background Glow &amp; Vision 2030 Shape -->
  <circle cx="480" cy="150" r="160" fill="#C7222A" opacity="0.05" />
  <circle cx="120" cy="300" r="160" fill="#D4AF37" opacity="0.05" />
  <!-- Corporate Modern Office Glass Window Frames -->
  <g stroke="#E2E8F0" stroke-width="1.5">
    <rect x="40" y="50" width="520" height="350" rx="12" fill="#F1F5F9" />
    <line x1="170" y1="50" x2="170" y2="400" />
    <line x1="300" y1="50" x2="300" y2="400" />
    <line x1="430" y1="50" x2="430" y2="400" />
    <line x1="40" y1="140" x2="560" y2="140" />
    <line x1="40" y1="230" x2="560" y2="230" />
    <line x1="40" y1="320" x2="560" y2="320" />
  </g>
  <!-- Riyadh Skyline through glass in soft slate -->
  <g fill="#CBD5E1" opacity="0.7">
    <polygon points="120,400 135,160 150,400" />
    <circle cx="135" cy="180" r="6" fill="#D4AF37" />
    <path d="M440,400 L455,120 Q480,80 505,120 L520,400 Z" />
    <ellipse cx="480" cy="140" rx="16" ry="24" fill="#F8FAFC" />
  </g>
  <!-- Handshake &amp; Partnership Emblem -->
  <g transform="translate(180, 160)">
    <path d="M120,20 L180,50 L180,130 Q120,180 60,130 L60,50 Z" fill="#FFFFFF" stroke="url(#aboutRed)" stroke-width="3" filter="url(#softShadowLight2)" />
    <path d="M120,60 L120,110" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" />
    <path d="M100,75 Q120,65 140,75" stroke="#D4AF37" stroke-width="2.5" fill="none" />
    <path d="M95,90 Q120,78 145,90" stroke="#D4AF37" stroke-width="2.5" fill="none" />
    <polygon points="120,45 125,55 135,55 127,62 130,72 120,66 110,72 113,62 105,55 115,55" fill="#C7222A" />
  </g>
  <!-- Trust Stat Card Left -->
  <g transform="translate(60, 240)" filter="url(#softShadowLight2)">
    <rect x="0" y="0" width="160" height="90" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="80" y="38" font-size="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" fill="#0F172A" text-anchor="middle">5,000+</text>
    <text x="80" y="60" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" fill="#475569" text-anchor="middle">Workers Placed</text>
    <text x="80" y="75" font-size="10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" fill="#C7222A" text-anchor="middle">Across Saudi Arabia</text>
  </g>
  <!-- Trust Stat Card Right -->
  <g transform="translate(380, 240)" filter="url(#softShadowLight2)">
    <rect x="0" y="0" width="160" height="90" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="80" y="38" font-size="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" fill="#C7222A" text-anchor="middle">100%</text>
    <text x="80" y="60" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" fill="#475569" text-anchor="middle">Qiwa &amp; Muqeem</text>
    <text x="80" y="75" font-size="10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" fill="#16A34A" text-anchor="middle">Certified Compliance</text>
  </g>
  <!-- Top Badge -->
  <rect x="175" y="25" width="250" height="34" rx="17" fill="#FFFFFF" stroke="#C7222A" stroke-width="1.5" filter="url(#softShadowLight2)" />
  <text x="300" y="47" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" fill="#C7222A" text-anchor="middle">SAUDI VISION 2030 ALIGNED</text>
</svg>
