    <!-- Arms -->
    <path d="M22,260 Q120,380 218,260 L200,320 Q120,410 40,320 Z" fill="#1E293B" stroke="#C7222A" stroke-width="1.5" />
    <circle cx="120" cy="140" r="44" fill="#D99B6A" />
    <path d="M85,145 Q120,195 155,145 Q150,185 120,185 Q90,185 85,145 Z" fill="#1E293B" opacity="0.8" />

