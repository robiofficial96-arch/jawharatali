  <path d="M50,850 L1150,850 L1050,720 L150,720 Z" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5" />
  <line x1="150" y1="720" x2="1050" y2="720" stroke="#C7222A" stroke-width="3" opacity="0.9" />

