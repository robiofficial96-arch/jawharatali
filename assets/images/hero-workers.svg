    <path d="M540,550 L560,200 Q600,140 640,200 L660,550 Z" />
    <ellipse cx="600" cy="220" rx="28" ry="38" fill="#F8FAFC" />
    <!-- Al Faisaliah Tower -->
    <polygon points="340,550 375,260 410,550" />
    <circle cx="375" cy="290" r="14" fill="#D4AF37" opacity="0.8" />
    <!-- Corporate Towers -->
    <rect x="180" y="380" width="80" height="170" rx="4" />
    <rect x="280" y="420" width="45" height="130" rx="4" />
    <rect x="430" y="360" width="90" height="190" rx="4" />
    <rect x="680" y="340" width="95" height="210" rx="4" />
    <rect x="795" y="390" width="70" height="160" rx="4" />
    <rect x="880" y="330" width="110" height="220" rx="4" />
    <rect x="1010" y="410" width="75" height="140" rx="4" />
