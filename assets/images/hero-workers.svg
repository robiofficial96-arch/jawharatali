    <line x1="60" y1="230" x2="60" y2="300" stroke="#FFFFFF" stroke-width="8" />
    <line x1="120" y1="230" x2="120" y2="300" stroke="#FFFFFF" stroke-width="8" />
    <!-- Branded Badge -->
