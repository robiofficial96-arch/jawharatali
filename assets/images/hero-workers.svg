    <text x="75" y="268" font-size="8" fill="#FFF" font-weight="bold" text-anchor="middle">JA</text>
    <circle cx="90" cy="180" r="32" fill="#D4A373" />
    <path d="M58,168 Q90,140 122,168 L136,174 L60,174 Z" fill="#1E293B" />
    <!-- Clipboard/Tablet -->
    <rect x="110" y="320" width="45" height="60" rx="4" fill="#FFFFFF" stroke="#C7222A" stroke-width="2" />
    <line x1="118" y1="335" x2="145" y2="335" stroke="#334155" stroke-width="2" />
    <line x1="118" y1="345" x2="140" y2="345" stroke="#334155" stroke-width="2" />
    <line x1="118" y1="355" x2="135" y2="355" stroke="#C7222A" stroke-width="2" />
  </g>

  <!-- 2. MID-LEFT (Prominent): Cleaning Specialist -->
  <g transform="translate(360, 240)" filter="url(#softShadowLight)">
    <rect x="65" y="440" width="30" height="160" fill="#334155" rx="6" />
    <rect x="105" y="440" width="30" height="160" fill="#334155" rx="6" />
    <!-- Crisp Uniform Polo -->
    <path d="M40,190 Q100,165 160,190 L170,440 L30,440 Z" fill="#475569" />
    <path d="M80,185 L100,230 L120,185 Z" fill="#C7222A" />
    <line x1="100" y1="230" x2="100" y2="280" stroke="#C7222A" stroke-width="3" />
    <!-- Brand Chest Badge -->
    <rect x="120" y="240" width="34" height="34" rx="4" fill="#FFFFFF" stroke="#C7222A" stroke-width="1.5" />
    <circle cx="137" cy="254" r="8" fill="#C7222A" />
    <text x="137" y="257" font-size="7" fill="#FFFFFF" font-weight="900" text-anchor="middle">JA</text>
    <text x="137" y="268" font-size="5" fill="#334155" font-weight="700" text-anchor="middle">JAWHARAT</text>
    <circle cx="100" cy="130" r="38" fill="#E0A97E" />
    <path d="M62,130 Q100,80 138,130 Q130,95 100,95 Q70,95 62,130 Z" fill="#0F172A" />
