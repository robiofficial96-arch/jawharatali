    <rect x="90" y="375" width="20" height="26" fill="#D4AF37" rx="2" />
    <line x1="125" y1="370" x2="135" y2="420" stroke="#EF4444" stroke-width="6" stroke-linecap="round" />
    <line x1="140" y1="370" x2="148" y2="415" stroke="#EAB308" stroke-width="5" stroke-linecap="round" />
    <circle cx="100" cy="130" r="38" fill="#C68642" />
    <path d="M70,122 L130,122" stroke="#0284C7" stroke-width="6" stroke-linecap="round" opacity="0.9" />
    <path d="M64,125 Q100,85 136,125 Z" fill="#1E293B" />
  </g>

  <!-- 5. RIGHT BACKGROUND: Hospitality Staff -->
  <g transform="translate(880, 290)" filter="url(#softShadowLight)">
    <path d="M50,220 L130,220 L145,460 L35,460 Z" fill="#1E293B" />
    <polygon points="75,220 105,220 90,260" fill="#FFFFFF" />
    <polygon points="87,235 93,235 95,275 85,275" fill="#C7222A" />
    <path d="M55,220 L75,220 L90,290 L105,220 L125,220 L135,390 L45,390 Z" fill="#334155" />
    <rect x="105" y="250" width="22" height="8" rx="2" fill="#D4AF37" />
    <circle cx="109" cy="254" r="2.5" fill="#C7222A" />
    <circle cx="90" cy="180" r="32" fill="#E8B491" />
    <path d="M60,170 Q90,140 120,170 Z" fill="#1E2022" />
    <ellipse cx="40" cy="340" rx="30" ry="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" />
  </g>

  <!-- FLOATING TRUST BADGES (Crisp Pure White Luxury Cards) -->

  <!-- Top Left: 100% Qiwa Compliant -->
  <g transform="translate(60, 80)" filter="url(#cardShadowLight)">
    <rect x="0" y="0" width="280" height="76" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="42" cy="38" r="22" fill="#C7222A" />
    <path d="M33,38 L39,44 L51,32" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="76" y="32" font-size="13" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" fill="#0F172A">100% QIWA COMPLIANT</text>
    <text x="76" y="50" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" fill="#64748B">MHRSD Verified &amp; Legal</text>
  </g>

  <!-- Bottom Right: 5,000+ Workers in KSA -->
  <g transform="translate(850, 680)" filter="url(#cardShadowLight)">
    <rect x="0" y="0" width="290" height="80" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="42" cy="40" r="22" fill="#C7222A" />
    <text x="42" y="45" font-size="13" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" fill="#FFFFFF" text-anchor="middle">5K+</text>
    <text x="78" y="34" font-size="13" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" fill="#0F172A">5,000+ WORKERS IN KSA</text>
    <text x="78" y="52" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" fill="#64748B">Ready For Rapid Mobilization</text>
  </g>

  <!-- Bottom Left: Replacement Guarantee -->
  <g transform="translate(60, 670)" filter="url(#cardShadowLight)">
    <rect x="0" y="0" width="270" height="74" rx="16" fill="#FFFFFF" stroke="rgba(199,34,42,0.3)" stroke-width="1.5" />
    <circle cx="40" cy="37" r="20" fill="url(#brandRedGrad)" />
    <path d="M33,37 A7,7 0 1,1 45,37" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="46,31 48,38 41,37" fill="#FFFFFF" />
    <text x="72" y="32" font-size="12" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" fill="#0F172A">REPLACEMENT GUARANTEE</text>
    <text x="72" y="49" font-size="10.5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" fill="#64748B">Free Replacement in 72 Hours</text>
  </g>

  <!-- Top Saudi Badge -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <rect x="-140" y="-15" width="280" height="34" rx="17" fill="#FFFFFF" stroke="#C7222A" stroke-width="1.5" filter="url(#cardShadowLight)" />
    <text x="0" y="7" font-size="11.5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" fill="#C7222A" letter-spacing="1.5">ðŸ‡¸ðŸ‡¦ KINGDOM OF SAUDI ARABIA</text>
  </g>
</svg>
