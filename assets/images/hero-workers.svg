<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" style="background: linear-gradient(135deg, #F8FAFC 0%, #FFFFFF 50%, #F1F5F9 100%);">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="brandRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E83842" />
      <stop offset="100%" stop-color="#C7222A" />
    </linearGradient>
    <linearGradient id="brandRedDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7222A" />
      <stop offset="100%" stop-color="#9F151C" />
    </linearGradient>
    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="cardGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
    <filter id="cardShadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Ambient light glow circles -->
  <circle cx="950" cy="200" r="280" fill="#C7222A" opacity="0.06" />
  <circle cx="250" cy="650" r="320" fill="#D4AF37" opacity="0.05" />
  <circle cx="600" cy="400" r="400" fill="#E2E8F0" opacity="0.3" />

  <!-- Geometric Grid Background (Light Mode) -->
  <g opacity="0.6">
    <path d="M0,150 L1200,150 M0,300 L1200,300 M0,450 L1200,450 M0,600 L1200,600 M0,750 L1200,750" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="8,8" />
    <path d="M200,0 L200,850 M400,0 L400,850 M600,0 L600,850 M800,0 L800,850 M1000,0 L1000,850" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="8,8" />
  </g>

  <!-- Riyadh Modern Skyline Silhouette in Soft Silver Slate -->
  <g fill="#CBD5E1" opacity="0.6">
