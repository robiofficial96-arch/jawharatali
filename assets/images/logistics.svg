<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" style="background: linear-gradient(135deg, #F8FAFC 0%, #FFFFFF 100%);">
  <defs>
    <linearGradient id="logiYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <circle cx="500" cy="100" r="140" fill="#F59E0B" opacity="0.08" />
  <circle cx="100" cy="280" r="150" fill="#C7222A" opacity="0.05" />
  <!-- Warehouse Racks -->
  <g stroke="#CBD5E1" stroke-width="2" opacity="0.8">
    <line x1="50" y1="80" x2="50" y2="350" stroke-width="3" />
    <line x1="160" y1="80" x2="160" y2="350" stroke-width="3" />
    <line x1="50" y1="140" x2="160" y2="140" />
    <line x1="50" y1="220" x2="160" y2="220" />
    <line x1="50" y1="300" x2="160" y2="300" />
    <rect x="65" y="95" width="38" height="38" fill="#D97706" opacity="0.8" rx="2" />
    <rect x="110" y="95" width="38" height="38" fill="#F59E0B" opacity="0.8" rx="2" />
    <rect x="65" y="175" width="40" height="40" fill="#C7222A" opacity="0.7" rx="2" />
    <rect x="110" y="175" width="40" height="40" fill="#D97706" opacity="0.8" rx="2" />
  </g>
  <!-- Forklift on right -->
  <g transform="translate(370, 200)" opacity="0.7">
    <rect x="30" y="60" width="100" height="60" rx="8" fill="#F59E0B" />
    <rect x="0" y="20" width="30" height="100" fill="#334155" />
    <circle cx="45" cy="125" r="18" fill="#1E293B" stroke="#CBD5E1" stroke-width="3" />
    <circle cx="115" cy="125" r="18" fill="#1E293B" stroke="#CBD5E1" stroke-width="3" />
    <line x1="-15" y1="90" x2="0" y2="90" stroke="#64748B" stroke-width="6" />
    <rect x="-40" y="60" width="32" height="30" fill="#B45309" rx="2" />
  </g>
  <!-- Character -->
  <g transform="translate(230, 95)">
    <rect x="55" y="180" width="22" height="90" fill="#334155" rx="4" />
    <rect x="85" y="180" width="22" height="90" fill="#334155" rx="4" />
    <rect x="50" y="260" width="28" height="15" fill="#0F172A" rx="3" />
    <rect x="85" y="260" width="28" height="15" fill="#0F172A" rx="3" />
    <path d="M35,65 L125,65 L135,185 L25,185 Z" fill="url(#logiYellow)" />
    <rect x="30" y="125" width="100" height="14" fill="#FFFFFF" opacity="0.95" />
    <!-- Brand Logo -->
    <rect x="42" y="85" width="24" height="18" rx="3" fill="#FFFFFF" stroke="#C7222A" stroke-width="1" />
    <text x="54" y="98" font-size="8" fill="#C7222A" font-weight="900" text-anchor="middle">JA</text>
    <circle cx="80" cy="35" r="26" fill="#D99B6A" />
    <path d="M54,28 Q80,10 106,28 L118,32 L54,32 Z" fill="#1E293B" />
    <rect x="110" y="140" width="18" height="32" rx="3" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
    <line x1="128" y1="150" x2="160" y2="170" stroke="#EF4444" stroke-width="2" stroke-dasharray="3,3" />
    <rect x="135" y="160" width="45" height="40" fill="#D97706" stroke="#92400E" stroke-width="1.5" rx="3" />
    <line x1="135" y1="180" x2="180" y2="180" stroke="#92400E" stroke-width="2" />
  </g>
  <!-- Category Badge -->
  <rect x="25" y="25" width="220" height="32" rx="16" fill="#FFFFFF" stroke="#C7222A" stroke-width="1.5" />
  <text x="135" y="46" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" fill="#C7222A" text-anchor="middle">LOGISTICS &amp; WAREHOUSE</text>
</svg>
