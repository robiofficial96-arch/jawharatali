      <path d="M0,45 C0,20 50,20 50,45 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" />
      <circle cx="25" cy="20" r="4" fill="#D4AF37" />
    </g>
  </g>
  <!-- Category Badge -->
  <rect x="25" y="25" width="210" height="32" rx="16" fill="#FFFFFF" stroke="#C7222A" stroke-width="1.5" />
  <text x="130" y="46" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" fill="#C7222A" text-anchor="middle">HOSPITALITY &amp; CATERING</text>
